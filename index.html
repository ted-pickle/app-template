<!doctype html>
<html lang="ko">
<head>
  <!-- ===== 이 head 부분은 그대로 두세요 (앱 설치에 필요해요) ===== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141A40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
  <!-- ===== 여기까지 그대로 ===== -->
  <title>내 앱</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; background: #F1F2F9; color: #141A40; text-align: center; }
    b { display: block; font-size: 28px; margin-bottom: 8px; }
    span { color: #555E8C; }
  </style>
</head>
<body>
  <div>
    <b>여기에 내 앱이 들어가요</b>
    <span>AI가 만들어 준 코드로 이 파일 전체를 바꿔 주세요</span>
  </div>
</body>
</html>
